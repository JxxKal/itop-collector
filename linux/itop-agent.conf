# Konfiguration des itop-agent.
#
# Format bewusst wie systemds EnvironmentFile: SCHLUESSEL=wert, eine Zeile je
# Eintrag. Der Agent liest die Datei auch direkt, die Unit haengt sie
# zusaetzlich als Umgebung ein.

# Basis-URL des Collectors (Pflicht).
ITOP_COLLECTOR_URL=https://collector.example.internal

# Interne CA im PEM-Format. Ist sie gesetzt, vertraut der Agent AUSSCHLIESSLICH
# dieser CA - das ist das Pinning aus Abschnitt 6 des PROJECT.md.
#ITOP_CA_CERT=/etc/itop-agent/ca.crt

# Zertifikatspruefung abschalten. NUR fuer Testaufbauten; der Agent warnt bei
# jedem Start, solange das gesetzt ist.
#ITOP_SKIP_TLS_VERIFY=1
