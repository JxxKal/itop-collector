; Host-seitige PHP-Overrides fuer iTop.
;
; Wird per Bind-Mount nach /usr/local/etc/php/conf.d/99-itop.ini gehaengt.
; Das Praefix 99 sorgt dafuer, dass diese Datei die im Image gebackene
; 90-itop-base.ini ueberschreibt - PHP liest conf.d alphabetisch, der
; letzte Wert gewinnt.
;
; Zweck: Werte anpassen, ohne das Image neu zu bauen. Container-Neustart
; genuegt. Alles was hier NICHT steht, gilt weiter aus 90-itop-base.ini.

; --- aktive Overrides -------------------------------------------------------

date.timezone = Europe/Berlin

; Grosse Impact-Analysen und CSV-Exporte laufen sonst in die Grenzen.
memory_limit = 512M
max_execution_time = 300

; --- fuer die Fehlersuche kurzzeitig einschaltbar ----------------------------
;
; Nicht dauerhaft anlassen: combodo-saml 1.2.1 bringt eine veraltete
; onelogin/php-saml mit, die libxml_disable_entity_loader() aufruft. Unter
; PHP 8.3 ist das eine Deprecation-Warnung - mit display_errors = On landet
; sie mitten in der SAML-Redirect-Ausgabe und zerlegt den Login.
;
; display_errors = On
; display_startup_errors = On
; error_reporting = E_ALL
