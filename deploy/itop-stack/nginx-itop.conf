# nginx vor iTop - TLS-Terminierung.
#
# Container-Port ist 8888 (wie in der Vorlage). Auf diesem Host ist 8888 aber
# bereits von Guacamole belegt, deshalb mappt der Stack 8889:8888.
# Aufruf also:  https://itop.example.internal:8889/

# ---------------------------------------------------------------------------
# Stolperstein 6 aus der Doku: 502 nach jedem Redeploy.
#
# Steht in proxy_pass ein statischer Name, loest nginx ihn EINMALIG beim Start
# auf. Wird der iTop-Container neu erstellt, bekommt er eine neue IP - nginx
# haelt die alte fest und liefert 502, bis man ihn neu startet.
#
# 127.0.0.11 ist Dockers eingebauter DNS. Sobald in proxy_pass eine VARIABLE
# steht, loest nginx pro Anfrage neu auf.
#
# Achtung: mit Variable uebernimmt nginx die Request-URI nicht mehr automatisch
# - deshalb $request_uri explizit anhaengen. Das ist die eigentliche Falle
# hinter dem Doku-Hinweis "mit Variable verliert nginx das URI-Rewriting".
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8888 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/itop.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/itop.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # iTop erlaubt Anhaenge bis upload_max_filesize/post_max_size (32M/64M laut
    # 90-itop-base.ini). nginx darf nicht vorher abschneiden.
    client_max_body_size 64m;

    # Der Setup-Wizard kompiliert das Datenmodell und laeuft dabei minutenlang
    # ohne eine Zeile zu senden. Mit dem Default von 60s bricht nginx mitten im
    # Schema-Upgrade mit 504 ab - und ein halb gelaufenes Setup ist genau das,
    # was man nicht will.
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
    proxy_connect_timeout 30s;

    access_log /var/log/nginx/itop.access.log;
    error_log  /var/log/nginx/itop.error.log;

    location / {
        set $itop_upstream http://itop:80;
        proxy_pass $itop_upstream$request_uri;

        proxy_http_version 1.1;

        # $http_host statt $host: enthaelt den Port so, wie der Client ihn
        # geschickt hat (itop.example.internal:8889). iTop baut daraus absolute URLs -
        # ohne Port landen Redirects auf 443.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8889;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
    }
}
